<div class="login-page d-flex align-items-center mt-5 justify-content-center" dir="rtl">
    <div class="login-card shadow p-3 rounded-4">

        <h3 class="text-center mb-4">🔐 تسجيل الدخول</h3>

        <div class="mb-3">
            <input [(ngModel)]="name" type="text" placeholder="👤 الاسم" class="form-control custom-input" />
        </div>

        <div class="mb-4">
            <input [(ngModel)]="password" type="password" placeholder="🔒 كلمة المرور"
                class="form-control custom-input" />
        </div>

        <button (click)="login()" [disabled]="!name || !password || loading" class="btn login-btn w-100">
            {{ loading ? 'جاري الدخول...' : 'تسجيل الدخول' }}
        </button>

    </div>
</div>
